<div class="accordion-item">

    <h2 class="accordion-header h5 mb-0" id="headingImage">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#fightersCollapseTwo" aria-expanded="false" aria-controls="fightersCollapseTwo">
            <span data-i18n="card.image.player_image"></span>
        </button>
    </h2>

    <div id="fightersCollapseTwo" class="accordion-collapse collapse" aria-labelledby="headingImage" data-bs-parent="#accordionStarCard">
        <div class="accordion-body">

            <div class="form-group mb-3">
                <label for="backgroundType" data-i18n="card.image.background">Background</label>
                <select class="form-select" id="backgroundType" name="backgroundType" oninput="onAnyChange()">
                    <option value="bg1" selected="selected" data-i18n="card.image.blue_textured">Blue textured</option>
                    <option value="bg2" data-i18n="card.image.light_blue">Light blue</option>
                    <option value="bg3" data-i18n="card.image.blue_gray_textured">Blue-gray textured</option>
                    <option value="bg4" data-i18n="card.image.white_textured">White textured</option>
                    <option value="bg5" data-i18n="card.image.simple_dark_blue">Simple dark blue</option>
                    <option value="bg6" data-i18n="card.image.simple_white">Simple white</option>
                </select>
            </div>

            <div class="form-group mb-3">
                <label for="imageSelect" data-i18n="card.image.load_image">Load image</label>
                <input class="form-control" id="imageSelect" oninput="onModelImageUpload()" type="file">
            </div>

            <input type="hidden" id="modelImageUrl" name="modelImageUrl" value="">

            <div class="row col-30">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="imageOffsetX" data-i18n="card.image.x_offset">X offset (&#8596;)</label>
                        <input class="form-control" id="imageOffsetX" oninput="onAnyChange()" type="number" value="0" />
                    </div>
                </div>

                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="imageOffsetY" data-i18n="card.image.y_offset">Y offset (&#8597;)</label>
                        <input class="form-control" id="imageOffsetY" oninput="onAnyChange()" type="number" value="0" />
                    </div>
                </div>

                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="imageScalePercent" data-i18n="card.image.scale_percent">Scale (%)</label>
                        <input class="form-control" id="imageScalePercent" min="0" max="300" oninput="onAnyChange()"
                               type="number" value="100" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
