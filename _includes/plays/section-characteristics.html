<div class="accordion-item">

    <h2 class="accordion-header h5 mb-0" id="missionsHeadingFive">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#missionsCollapseFive" aria-expanded="false" aria-controls="missionsCollapseFive">
            Characteristics
        </button>
    </h2>

    <div id="missionsCollapseFive" class="accordion-collapse collapse" aria-labelledby="missionsHeadingFive" data-bs-parent="#accordionPlays">
        <div class="accordion-body">

            <div class="form-group mb-3">
                <label for="playName">Play Name</label>
                <input class="form-control" type="text" id="playName" name="playName" value=" "
                    oninput="onAnyChange()">
            </div>

            <div class="form-group mb-3">
                <label for="teamName">Team Name</label>
                <input class="form-control" type="text" id="teamName" name="teamName" value="General"
                    oninput="onAnyChange()">
            </div>

            <div class="form-group mb-3">
                <label for="colorPicker">Choose a circle colour:</label>
                <input class="form-control form-control-color" type="color" id="colorPicker" name="colorPicker" value="#FFFFFF" oninput="onAnyChange()">
            </div>
            
            <div class="form-group">
                <label for="colorPickerText">Choose a text colour:</label>
                <input class="form-control form-control-color" type="color" id="colorPickerText" name="colorPickerText" value="#000000" oninput="onAnyChange()">
            </div>
        </div>
    </div>
</div>
