<div class="form-check mt-3">
    <input class="form-check-input" id="removeBorder" onchange="onAnyChange()" type="checkbox">
    <label class="form-check-label" for="removeBorder" data-i18n="card.action.remove_border">Remove border to add bleed area for printing</label>
</div>

<div class="mt-4">
    <button type="button" class="btn btn-primary" id="saveCanvasButton" onclick="saveCardAsImage()">
        <span data-i18n="card.action.save_as_image"/>
    </button>
</div>

<div class="mt-4">
    <button type="button" class="btn btn-success" onclick="sendCurrentCardToPrint('play', this)">
        <span data-i18n="card.action.send_to_print">Send to print</span>
    </button>
</div>

<div class="mt-4">
    <button type="button" class="btn btn-primary" id="saveButton" onclick="onSaveClicked()">
        <span data-i18n="card.action.save_as_file"/>
    </button>
</div>

<div class="mt-4">
    <select class="form-select" id="sel" onchange="loadPlayFromList()">
    </select>
</div>

<div class="mt-4">
    <label for="loadbutton" data-i18n="card.action.load">Load card file</label>
    <input class="form-control" id="loadbutton" oninput="fileChange(this.files[0])" type="file">
</div>

<div class="mt-4">
    <button type="button" class="btn btn-outline-danger" id="clearCacheButton" onclick="onClearCache()">
        <span data-i18n="card.action.reset_all"/>
    </button>
</div>

<div class="input-group mb-6 mt-2">
    <br>
    <br>
</div>
