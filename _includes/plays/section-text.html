<div class="accordion-item">

    <h2 class="accordion-header h5 mb-0" id="missionsHeadingSix">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#missionsCollapseSix" aria-expanded="false" aria-controls="missionsCollapseSix">
            Text
        </button>
    </h2>

    <div id="missionsCollapseSix" class="accordion-collapse collapse" aria-labelledby="missionsHeadingSix" data-bs-parent="#accordionPlays">
        <div class="accordion-body">

            <div class="form-group mb-3">
                <label for="textValue">Text</label>
                <textarea class="form-control" id="textValue" name="textValue" rows="4"
                    oninput="onAnyChange()"></textarea>
            </div>

            <div class="form-group">
                <label for="fontSize">Font Size</label>
                <div class="col-sm-2">
                    <input type="number" class="form-control" id="fontSize" name="fontSize" min="1" step="1"  value="42" oninput="onAnyChange()" />
                </div>
            </div>
        </div>
    </div>
</div>
