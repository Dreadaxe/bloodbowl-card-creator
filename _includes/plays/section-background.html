<div class="accordion-item">

    <h2 class="accordion-header h5 mb-0" id="missionsHeadingOne">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#missionsCollapseOne" aria-expanded="false" aria-controls="missionsCollapseOne">
            Background
        </button>
    </h2>

    <div id="missionsCollapseOne"  class="accordion-collapse collapse" aria-labelledby="missionsHeadingOne" data-bs-parent="#accordionPlays">
        <div class="accordion-body">

            <div class="row">
                <div class="col-6">
                  <select class="form-select" id="background-list" name="background-list" onchange="onAnyChange()">
                    <optgroup label="Simple">
                        <option value="bg-07">Plain</option>
                        <option value="bg2">Stone</option>
                    </optgroup>
                  </select>
                </div>
              </div>
            
        </div>

            {% comment %}
            <div class="form-group mt-4">
                <label for="backgroundSelect">Load custom background</label>
                <input disabled aria-describedby="fileHelp" class="form-control-file" id="backgroundSelect"
                    oninput="onAnyChange()" type="file">
                <!-- <small id="fileHelp" class="form-text text-muted">This is some placeholder block-level help text for the above input. It's a bit lighter and easily wraps to a new line.</small> -->
            </div>
            {% endcomment %}

    </div>
</div>

<div class="accordion-item">

    <h2 class="accordion-header h5 mb-0" id="customBackgroundHeading">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#customBackgroundCollapse" aria-expanded="false" aria-controls="customBackgroundCollapse">
            Custom Background
        </button>
    </h2>
        
    <div id="customBackgroundCollapse" class="accordion-collapse collapse" aria-labelledby="customBackgroundHeading" data-bs-parent="#accordionPlays">
        <div class="accordion-body">
        
            <div class="form-group mb-3">
                <label for="customBackgroundSelect">Load image</label>
                <input class="form-control" id="customBackgroundSelect" oninput="onCustomBackgroundUpload()" type="file">
            </div>
        
            <input type="hidden" id="customBackgroundUrl" name="customBackgroundUrl" value="">

            <div class="row col-30">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="customBackgroundOffsetX" data-i18n="card.image.x_offset">X offset (&#8596;)</label>
                        <input class="form-control" id="customBackgroundOffsetX" oninput="onAnyChange()" type="number" value="0" />
                    </div>
                </div>

                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="customBackgroundOffsetY" data-i18n="card.image.y_offset">Y offset (&#8597;)</label>
                        <input class="form-control" id="customBackgroundOffsetY" oninput="onAnyChange()" type="number" value="0" />
                    </div>
                </div>

                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="customBackgroundScalePercent" data-i18n="card.image.scale_percent">Scale (%)</label>
                        <input class="form-control" id="customBackgroundScalePercent" min="0" max="300" oninput="onAnyChange()"
                               type="number" value="100" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
