<div class="accordion-item">

    <h2 class="accordion-header h5 mb-0" id="headingImage">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#missionsCollapseTwo" aria-expanded="false" aria-controls="missionsCollapseTwo">
                Optional Image
        </button>
    </h2>

    <div id="missionsCollapseTwo" class="accordion-collapse collapse" aria-labelledby="headingImage" data-bs-parent="#accordionPlays">
        <div class="accordion-body">

            <div class="form-group mb-3">
                <label for="imageSelect">Load image</label>
                <input class="form-control" id="imageSelect" oninput="onModelImageUpload()" type="file">
            </div>

            <div class="form-group mb-3">
                <label for="imageSelectList">Logo List</label>
                <select class="form-select" id="imageSelectList" onchange="onImageSelectChange()">
                    <option value="">Select an image</option>
                    <!-- Options for images in the folder will be dynamically populated here -->
                </select>
            </div>
            
            <input type="hidden" id="modelImageUrl" name="modelImageUrl" value="">

            <div class="row col-30">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="imageOffsetX" data-i18n="card.image.x_offset">X offset (&#8596;)</label>
                        <input class="form-control" id="imageOffsetX" oninput="onAnyChange()" type="number" value="0" />
                    </div>
                </div>

                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="imageOffsetY" data-i18n="card.image.y_offset">Y offset (&#8597;)</label>
                        <input class="form-control" id="imageOffsetY" oninput="onAnyChange()" type="number" value="0" />
                    </div>
                </div>

                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="imageScalePercent" data-i18n="card.image.scale_percent">Scale (%)</label>
                        <input class="form-control" id="imageScalePercent" min="0" max="300" oninput="onAnyChange()"
                               type="number" value="100" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
