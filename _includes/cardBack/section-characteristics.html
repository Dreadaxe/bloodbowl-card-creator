<div class="accordion-item">

    <h2 class="accordion-header h5 mb-0" id="headingCharacteristics">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#fightersCollapseFive" aria-expanded="false" aria-controls="fightersCollapseFive">
            <span data-i18n="card.special.card_details"></span>
        </button>
    </h2>

    <div id="fightersCollapseFive" class="accordion-collapse collapse" aria-labelledby="headingCharacteristics" data-bs-parent="#accordionCardBack">
        <div class="accordion-body">

            <div class="form-group mb-3">
                <label for="backgroundType" data-i18n="card.image.background">Background</label>
                <select class="form-select" id="backgroundType" name="backgroundType" oninput="onAnyChange()">
                    <option value="bg1" selected="selected" data-i18n="card.card_back.simple_background">Simple background</option>
                    <option value="bg2" data-i18n="card.card_back.background_logo">Background with Logo</option>
                    <option value="bg3" data-i18n="card.card_back.background_header">Background with Header</option>
                    <option value="bg4" data-i18n="card.card_back.background_logo_header">Background with Logo and Header</option>
                </select>
            </div>

            <div class="form-group mb-3">
                <div class="d-flex mb-1">
                    <label class="me-4" for="cardName" data-i18n="card.special.card_name">Card Name</label>
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="onClearInput('cardName')" data-i18n="card.caracteristics.clear">Clear</button>
                </div>
                <input class="form-control" type="text" id="cardName" name="cardName" value="" oninput="onAnyChange()">
            </div>

            <div class="form-group mb-3">
                <label for="fontSizeSelector"  data-i18n="card.special.font_size">Font Size:</label>
                <div class="col-sm-2">
                    <input class="form-control" type="number" id="fontSizeSelector" name="fontSizeSelector" value="32" oninput="onAnyChange()">
                </div>
            </div>

            <div class="form-group mb-3">
                <div class="d-flex mb-1">
                    <label class="me-4" for="cardText"  data-i18n="card.caracteristics.body_text">Body Text</label>
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="onClearInput('cardText')" data-i18n="card.caracteristics.clear">Clear</button>
                </div>
                <textarea class="form-control" id="cardText" name="cardText" rows="3" oninput="onAnyChange()" data-i18n="card.caracteristics.body_text">Body Text</textarea>
            </div>

            <div class="form-group">
                <label for="footer" data-i18n="card.special.footer">Footer</label>
                <input class="form-control" type="text" id="footer" name="footer" value="" oninput="onAnyChange()">
            </div>
        </div>
    </div>
</div>
