<div class="accordion-item">

    <h2 class="accordion-header h5 mb-0" id="headingImage">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#fightersCollapseTwo" aria-expanded="false" aria-controls="fightersCollapseTwo">
            <span data-i18n="card.image.icon_image"></span>
        </button>
    </h2>

    <div id="fightersCollapseTwo" class="accordion-collapse collapse" aria-labelledby="headingImage" data-bs-parent="#accordionSpecial">
        <div class="accordion-body">
            
            <div class="form-group mb-3">
                <label for="chooseIcon" data-i18n="card.image.choose_icon">Choose icon</label>
                <select class="form-select" id="chooseIcon" name="chooseIcon" oninput="onChooseIcon(chooseIcon.value)">
                    <option value="" disabled selected hidden data-i18n="card.image.choose_icon">Choose icon</option>
                    <option value="agility_skill_icon_100x100.png">Agility</option>
                    <option value="blood_bowl_icon.png">Blood Bowl</option>
                    <option value="BOTH DOWN.png">BOTH DOWN</option>
                    <option value="devious_skill_icon_100x100.png">Devious</option>
                    <option value="dice.png">Dice</option>
                    <option value="elite_skill_icon_100x100.png">Elite</option>
                    <option value="general_skill_icon_100x100.png">General</option>
                    <option value="mutation_skill_icon_100x100.png">Mutation</option>
                    <option value="Nuffle-Zone-Ball.png">Ball</option>
                    <option value="passing_skill_icon_100x100.png">Passing</option>
                    <option value="PLAYER DOWN.png">PLAYER DOWN</option>
                    <option value="POW.png">POW</option>
                    <option value="PUSH BACK.png">PUSH BACK</option>
                    <option value="strength_skill_icon_100x100.png">Strength</option>
                    <option value="STUMBLE.png">STUMBLE</option>
                    <option value="trait_icon_100x100.png">Trait</option>
                </select>
            </div>

            <div class="form-group mb-3">
                <label for="imageSelect" data-i18n="card.image.load_icon">Load icon (recommended 100x100 px)</label>
                <input class="form-control" id="imageSelect" oninput="onModelImageUpload()" type="file">
            </div>

            <div class="mb-3">
                <button type="button" class="btn btn-outline-danger" onclick="onClearInput('modelImageUrl')" data-i18n="card.caracteristics.clear">Clear</button>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="centerImage" onchange="onAnyChange()">
                <label class="form-check-label" for="centerImage" data-i18n="card.image.center_image">Center image</label>
            </div>

            <input type="hidden" id="modelImageUrl" name="modelImageUrl" value="">

            <div class="row col-30">
                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="imageOffsetX" data-i18n="card.image.x_offset">X offset (&#8596;)</label>
                        <input class="form-control" id="imageOffsetX" oninput="onAnyChange()" type="number" value="0" />
                    </div>
                </div>

                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="imageOffsetY" data-i18n="card.image.y_offset">Y offset (&#8597;)</label>
                        <input class="form-control" id="imageOffsetY" oninput="onAnyChange()" type="number" value="0" />
                    </div>
                </div>

                <div class="col-sm-4">
                    <div class="form-group">
                        <label for="imageScalePercent" data-i18n="card.image.scale_percent">Scale (%)</label>
                        <input class="form-control" id="imageScalePercent" min="0" max="300" oninput="onAnyChange()"
                               type="number" value="100" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
